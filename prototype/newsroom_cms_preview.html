<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsroom — Symfony + React CMS</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f6f7fb;--panel:#fff;--ink:#172033;--muted:#687386;--line:#e6e9ef;--brand:#5b5bd6;--brand2:#3f46a3;--success:#14804a;--warn:#a35a00;--danger:#b33a48;--soft:#eef0ff;--shadow:0 18px 50px rgba(28,36,68,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}.topbar{height:64px;background:#10162d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}.brand{display:flex;gap:12px;align-items:center;font-weight:800;letter-spacing:-.02em}.brandmark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#8c8cff,#4b54d8);display:grid;place-items:center;box-shadow:0 10px 28px rgba(92,92,214,.34)}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn,.avatar{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:64px;height:calc(100vh - 64px)}.nav-group{margin-bottom:26px}.nav-label{padding:0 12px 9px;color:#9aa3b5;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;margin:3px 0;border-radius:11px;color:#596377;font-size:14px;font-weight:650}.nav-item:hover{background:#f3f4fb}.nav-item.active{background:var(--soft);color:var(--brand2)}.page{padding:28px;max-width:1440px;width:100%;margin:0 auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--brand);font-weight:800}.page h1{margin:5px 0 0;font-size:30px;letter-spacing:-.04em}.page p.lead{margin:6px 0 0;color:var(--muted);font-size:14px}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:750;font-size:13px;display:inline-flex;align-items:center;gap:8px}.btn.primary{background:var(--brand);color:#fff;box-shadow:0 10px 24px rgba(91,91,214,.2)}.btn.secondary{background:#fff;border:1px solid var(--line);color:#465066}.btn.ghost{background:transparent;color:#606a7d}.btn.danger{background:#fff0f1;color:var(--danger)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:700}.stat-value{font-size:27px;font-weight:820;margin:9px 0 2px;letter-spacing:-.04em}.stat-foot{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.65fr 1fr;gap:18px}.card-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.card-title{font-size:15px;font-weight:800}.muted{color:var(--muted)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8b94a7;background:#fbfbfd}.table tr:hover td{background:#fcfcff}.article-cell{display:flex;align-items:center;gap:12px;min-width:310px}.thumb{width:52px;height:38px;border-radius:9px;flex:0 0 auto;background:linear-gradient(135deg,#e5e7ff,#aab0ff)}.article-meta strong{display:block;white-space:normal;font-size:13px}.article-meta span{font-size:11px;color:#8a93a5}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.badge.live{background:#eaf8ef;color:var(--success)}.badge.draft{background:#f0f1f5;color:#656f82}.badge.review{background:#fff4e7;color:var(--warn)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid var(--line)}.input,textarea,select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;color:var(--ink);outline:none}.input:focus,textarea:focus,select:focus{border-color:#9b9bf0;box-shadow:0 0 0 3px rgba(91,91,214,.1)}.search{min-width:230px}.public .page{max-width:1280px}.public .topbar{position:relative}.public-grid{display:grid;grid-template-columns:1.55fr .8fr;gap:24px}.hero{border-radius:22px;overflow:hidden;background:#11172d;color:#fff;min-height:420px;position:relative}.hero-bg{position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,rgba(121,133,255,.58),transparent 28%),linear-gradient(135deg,#181f42,#0e1325)}.hero-art{position:absolute;right:0;bottom:0;width:58%;height:78%;opacity:.65;background:linear-gradient(145deg,transparent 0 28%,rgba(255,255,255,.08) 28% 29%,transparent 29% 45%,rgba(255,255,255,.07) 45% 46%,transparent 46%),radial-gradient(circle at 60% 48%,rgba(255,255,255,.13),transparent 38%);clip-path:polygon(38% 0,100% 0,100% 100%,0 100%)}.hero-copy{position:relative;z-index:2;max-width:620px;padding:58px}.hero .eyebrow{color:#b9b9ff}.hero h2{font-size:46px;line-height:1.04;letter-spacing:-.05em;margin:14px 0}.hero p{color:#cdd2e8;line-height:1.6}.hero-meta{display:flex;align-items:center;gap:10px;margin-top:25px;font-size:12px;color:#d6d9e6}.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);padding:7px 9px;border-radius:999px}.side-list{display:grid;gap:12px}.story{display:grid;grid-template-columns:92px 1fr;gap:13px;padding:13px}.story-thumb{border-radius:12px;background:linear-gradient(135deg,#ffdec6,#e5b98e);min-height:78px}.story h3{font-size:14px;margin:0 0 7px;line-height:1.35}.story p{font-size:11px;color:var(--muted);margin:0}.section{margin-top:32px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-title{font-size:20px;font-weight:850;letter-spacing:-.03em}.cat-row{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.cat{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:750;white-space:nowrap}.cat.active{background:#151d3a;color:#fff;border-color:#151d3a}.news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.news-card{overflow:hidden}.news-img{height:150px;background:linear-gradient(135deg,#d6e3ff,#a0b5df)}.news-body{padding:16px}.news-body h3{font-size:16px;line-height:1.28;margin:0 0 8px;letter-spacing:-.02em}.news-body p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 13px}.news-footer{font-size:11px;color:#8a93a5;display:flex;justify-content:space-between}.admin-note{margin-top:15px;padding:13px 14px;background:#f8f8ff;border:1px dashed #d8d9ff;border-radius:11px;font-size:12px;color:#5a6175}.comments{display:grid;gap:12px;padding:18px}.comment{padding:15px;border:1px solid var(--line);border-radius:13px;background:#fff}.comment-top{display:flex;justify-content:space-between;gap:12px}.comment-author{font-size:13px;font-weight:800}.comment-text{font-size:13px;line-height:1.55;color:#4f596e;margin:8px 0}.comment-actions{display:flex;gap:7px}.mini{padding:7px 10px;font-size:11px}.overlay{position:fixed;inset:0;background:rgba(10,16,33,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.overlay.open{display:flex}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(18,24,54,.28)}.modal-head,.modal-foot{padding:18px 20px;border-bottom:1px solid var(--line)}.modal-foot{border-top:1px solid var(--line);border-bottom:0;display:flex;justify-content:flex-end;gap:8px}.modal-body{padding:20px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;font-weight:800;color:#5a6579}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{padding:40px;text-align:center;color:var(--muted)}.public .sidebar{display:none}.public .layout{display:block}.public .page{padding-top:36px}.public-nav{display:flex;gap:18px;font-size:12px;color:#ccd2e5}.public-nav span{cursor:pointer}.public .topbar{padding:0 30px}.public .brandmark{background:linear-gradient(135deg,#a5a4ff,#5a63e3)}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.public-grid{grid-template-columns:1fr}.news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:210px 1fr}}
@media(max-width:760px){.topbar{padding:0 15px}.layout{grid-template-columns:1fr}.sidebar{display:none}.page{padding:20px 15px}.stats{grid-template-columns:1fr 1fr;gap:10px}.page h1{font-size:25px}.news-grid{grid-template-columns:1fr}.hero{min-height:420px}.hero-copy{padding:34px 26px}.hero h2{font-size:34px}.public-nav{display:none}.row2{grid-template-columns:1fr}.search{width:100%;min-width:0}.toolbar{align-items:stretch}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modalRoot" class="overlay"></div>
<script>
const icon=(name,size=17)=>{const s={stroke:'currentColor','stroke-width':'1.8','fill':'none','stroke-linecap':'round','stroke-linejoin':'round'};const p={
 dashboard:`<path ${attrs(s)} d="M3 13h7V3H3v10Zm11 8h7V3h-7v18ZM3 21h7v-4H3v4Z"/>`,
 file:`<path ${attrs(s)} d="M6 2h9l4 4v16H6z"/><path ${attrs(s)} d="M15 2v5h5M9 12h6M9 16h6"/>`,
 folder:`<path ${attrs(s)} d="M3 6h7l2 2h9v11H3z"/>`,
 tag:`<path ${attrs(s)} d="M3 11V5a2 2 0 0 1 2-2h6l10 10-7 7L4 10a2 2 0 0 1-1-1v2Z"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/>`,
 comment:`<path ${attrs(s)} d="M4 5h16v10H9l-5 4z"/><path ${attrs(s)} d="M8 9h8M8 12h5"/>`,
 settings:`<path ${attrs(s)} d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/>`,
 plus:`<path ${attrs(s)} d="M12 5v14M5 12h14"/>`,
 search:`<circle cx="10.8" cy="10.8" r="6.8"/><path ${attrs(s)} d="m16 16 5 5"/>`,
 edit:`<path ${attrs(s)} d="m4 20 4.2-.7L19 8.5a2 2 0 0 0-2.8-2.8L5.4 16.5z"/><path ${attrs(s)} d="m14.8 6.2 3 3"/>`,
 trash:`<path ${attrs(s)} d="M4 7h16M10 11v6M14 11v6M7 7l1 13h8l1-13M9 7V4h6v3"/>`,
 eye:`<path ${attrs(s)} d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>`,
 close:`<path ${attrs(s)} d="M6 6l12 12M18 6 6 18"/>`,
 check:`<path ${attrs(s)} d="m5 12 4 4L19 6"/>`,
 chevron:`<path ${attrs(s)} d="m7 10 5 5 5-5"/>`,
 user:`<circle cx="12" cy="8" r="3.2"/><path ${attrs(s)} d="M5 20c.7-3.8 3.1-5.5 7-5.5s6.3 1.7 7 5.5"/>`,
 logout:`<path ${attrs(s)} d="M10 17l5-5-5-5M15 12H3M20 4v16"/>`
};return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${p[name]||''}</svg>`};
function attrs(o){return Object.entries(o).map(([k,v])=>`${k}="${v}"`).join(' ')}

let state={view:'dashboard',query:'',modal:null,editId:null,flash:'',posts:[
{id:1,title:'How AI is changing the newsroom in 2026',category:'Technology',status:'Published',author:'Admin',date:'Oct 7, 2026',views:'18.4K'},
{id:2,title:'The new economics of independent publishing',category:'Business',status:'Published',author:'Mai Nguyen',date:'Oct 6, 2026',views:'12.8K'},
{id:3,title:'A city guide to the season’s best exhibitions',category:'Culture',status:'Draft',author:'Linh Tran',date:'Oct 5, 2026',views:'—'},
{id:4,title:'What the latest data says about remote work',category:'World',status:'Review',author:'Quang Le',date:'Oct 4, 2026',views:'9.2K'},
],categories:[{id:1,name:'Technology',count:42},{id:2,name:'Business',count:31},{id:3,name:'Culture',count:24},{id:4,name:'World',count:19},{id:5,name:'Lifestyle',count:16}],tags:[{id:1,name:'AI',count:18},{id:2,name:'Startups',count:11},{id:3,name:'Climate',count:9},{id:4,name:'Design',count:7},{id:5,name:'Media',count:6}],comments:[
{id:1,author:'Alex Morgan',post:'How AI is changing the newsroom in 2026',text:'Clear analysis and practical examples. The section on verification was especially useful.',status:'Pending',date:'12 min ago'},
{id:2,author:'Thu Ha',post:'The new economics of independent publishing',text:'Would love to see the same analysis for Southeast Asian publishers.',status:'Approved',date:'2 hr ago'},
{id:3,author:'Daniel Kim',post:'A city guide to the season’s best exhibitions',text:'Bookmarking this for the weekend.',status:'Pending',date:'5 hr ago'}]};

function setFlash(t){state.flash=t;render();setTimeout(()=>{state.flash='';render()},2200)}
function nav(v){state.view=v;render()}
function filteredPosts(){return state.posts.filter(p=>`${p.title} ${p.category} ${p.author}`.toLowerCase().includes(state.query.toLowerCase()))}
function layout(content){return `<div class="topbar"><div class="brand"><div class="brandmark">${icon('file',17)}</div><span>Newsroom</span></div><div class="top-actions"><button class="icon-btn" title="Preview site" onclick="nav('public')">${icon('eye',16)}</button><div class="avatar">${icon('user',15)}</div></div></div><div class="layout"><aside class="sidebar">
<div class="nav-group"><div class="nav-label">Workspace</div>${navItem('dashboard','Dashboard','Dashboard')}${navItem('file','Posts','Posts')}${navItem('folder','Categories','Categories')}${navItem('tag','Tags','Tags')}${navItem('comment','Comments','Comments')}</div>
<div class="nav-group"><div class="nav-label">System</div>${navItem('settings','Settings','Settings')}${navItem('user','Users','Users')}</div>
<div class="admin-note">Symfony API + MySQL backend<br>React + Tailwind admin UI</div>
</aside><main class="page">${content}</main></div>`}
function navItem(iconName,label,key){return `<div class="nav-item ${state.view===key.toLowerCase()?'active':''}" onclick="nav('${key.toLowerCase()}')">${icon(iconName,16)}<span>${label}</span></div>`}
function app(){if(state.view==='public')return publicSite();return layout(adminView())}
function adminView(){if(state.view==='posts')return postsPage();if(state.view==='categories')return taxonomyPage('Categories');if(state.view==='tags')return taxonomyPage('Tags');if(state.view==='comments')return commentsPage();if(state.view==='settings')return settingsPage();if(state.view==='users')return usersPage();return dashboardPage()}
function dashboardPage(){return `<div class="pagehead"><div><div class="eyebrow">Admin panel</div><h1>Editorial dashboard</h1><p class="lead">A single workspace for publishing, taxonomy and moderation.</p></div><button class="btn primary" onclick="openPost()">${icon('plus',16)} New post</button></div><div class="stats">${stat('Published posts','128','+8 this month')}${stat('Comments','36','12 awaiting review')}${stat('Categories','9','5 active sections')}${stat('Total views','248K','+14.2% vs last month')}</div><div class="grid2"><section class="card"><div class="card-head"><div class="card-title">Recent posts</div><button class="btn ghost" onclick="nav('posts')">View all ${icon('chevron',14)}</button></div><div class="table-wrap">${postTable(filteredPosts().slice(0,4))}</div></section><section class="card"><div class="card-head"><div class="card-title">Comment moderation</div><button class="btn ghost" onclick="nav('comments')">Open queue</button></div><div class="comments">${state.comments.slice(0,3).map(commentHtml).join('')}</div></section></div>`}
function stat(label,val,foot){return `<div class="card stat"><div class="stat-top"><span>${label}</span>${icon('eye',14)}</div><div class="stat-value">${val}</div><div class="stat-foot">${foot}</div></div>`}
function postsPage(){return `<div class="pagehead"><div><div class="eyebrow">Content</div><h1>Posts</h1><p class="lead">Create, edit, publish and delete newsroom stories.</p></div><button class="btn primary" onclick="openPost()">${icon('plus',16)} New post</button></div><section class="card"><div class="toolbar"><div style="position:relative;flex:1"><span style="position:absolute;left:11px;top:9px;color:#929bad">${icon('search',15)}</span><input class="input search" style="padding-left:34px;width:100%" placeholder="Search title, category or author" value="${state.query}" oninput="state.query=this.value;render()"></div><select onchange="filterStatus(this.value)" class="input"><option value="">All statuses</option><option>Published</option><option>Draft</option><option>Review</option></select></div><div class="table-wrap">${postTable(filteredPosts())}</div></section>`}
function filterStatus(v){state.status=v;render()}
function postTable(items){let arr=state.status?items.filter(p=>p.status===state.status):items; if(!arr.length)return `<div class="empty">No posts match this filter.</div>`;return `<table class="table"><thead><tr><th>Post</th><th>Status</th><th>Author</th><th>Published</th><th>Views</th><th></th></tr></thead><tbody>${arr.map(p=>`<tr><td><div class="article-cell"><div class="thumb"></div><div class="article-meta"><strong>${p.title}</strong><span>${p.category}</span></div></div></td><td>${statusBadge(p.status)}</td><td>${p.author}</td><td>${p.date}</td><td>${p.views}</td><td><div style="display:flex;gap:4px"><button class="btn ghost mini" onclick="openPost(${p.id})">${icon('edit',14)}</button><button class="btn danger mini" onclick="deletePost(${p.id})">${icon('trash',14)}</button></div></td></tr>`).join('')}</tbody></table>`}
function statusBadge(s){return `<span class="badge ${s==='Published'?'live':s==='Draft'?'draft':'review'}">${icon(s==='Published'?'check':'eye',11)}${s}</span>`}
function openPost(id){state.modal='post';state.editId=id||null;render()}
function savePost(){const title=document.querySelector('#postTitle').value.trim();const cat=document.querySelector('#postCat').value;const status=document.querySelector('#postStatus').value;if(!title){document.querySelector('#postTitle').focus();return}if(state.editId){const p=state.posts.find(x=>x.id===state.editId);Object.assign(p,{title,category:cat,status}) ;setFlash('Post updated successfully')}else{state.posts.unshift({id:Date.now(),title,category:cat,status,author:'Admin',date:'Just now',views:'—'});setFlash('Post created successfully')}state.modal=null;render()}
function deletePost(id){if(!confirm('Delete this post?'))return;state.posts=state.posts.filter(p=>p.id!==id);setFlash('Post deleted')}
function taxonomyPage(kind){const isCat=kind==='Categories';const arr=isCat?state.categories:state.tags;return `<div class="pagehead"><div><div class="eyebrow">Content structure</div><h1>${kind}</h1><p class="lead">CRUD management for ${kind.toLowerCase()}.</p></div><button class="btn primary" onclick="openTax('${kind}')">${icon('plus',16)} New ${isCat?'category':'tag'}</button></div><section class="card"><div class="card-head"><div class="card-title">All ${kind.toLowerCase()}</div><span class="muted">${arr.length} records</span></div><table class="table"><thead><tr><th>Name</th><th>Usage</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td><strong>${x.name}</strong></td><td>${x.count} posts</td><td><div style="display:flex;gap:4px"><button class="btn ghost mini" onclick="openTax('${kind}',${x.id})">${icon('edit',14)}</button><button class="btn danger mini" onclick="deleteTax('${kind}',${x.id})">${icon('trash',14)}</button></div></td></tr>`).join('')}</tbody></table></section>`}
function openTax(kind,id){state.modal='tax';state.taxKind=kind;state.editId=id||null;render()}
function saveTax(){const name=document.querySelector('#taxName').value.trim();if(!name)return;const arr=state.taxKind==='Categories'?state.categories:state.tags;if(state.editId)arr.find(x=>x.id===state.editId).name=name;else arr.push({id:Date.now(),name,count:0});state.modal=null;setFlash(`${state.taxKind.slice(0,-1)} saved`);render()}
function deleteTax(kind,id){const arr=kind==='Categories'?state.categories:state.tags;if(confirm(`Delete this ${kind.slice(0,-1).toLowerCase()}?`)){const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);setFlash(`${kind.slice(0,-1)} deleted`)}}
function commentsPage(){return `<div class="pagehead"><div><div class="eyebrow">Community</div><h1>Comments</h1><p class="lead">Review, approve or remove reader comments.</p></div></div><section class="card"><div class="toolbar"><select class="input" onchange="filterComments(this.value)"><option value="">All comments</option><option>Pending</option><option>Approved</option><option>Rejected</option></select><span class="muted" style="font-size:12px">${state.comments.filter(c=>c.status==='Pending').length} pending review</span></div><div class="comments">${state.comments.filter(c=>!state.commentStatus||c.status===state.commentStatus).map(commentHtml).join('')}</div></section>`}
function filterComments(v){state.commentStatus=v;render()}
function commentHtml(c){return `<div class="comment"><div class="comment-top"><div><div class="comment-author">${c.author}</div><div class="muted" style="font-size:11px">on ${c.post} · ${c.date}</div></div>${statusBadge(c.status)}</div><div class="comment-text">${c.text}</div><div class="comment-actions">${c.status==='Pending'?`<button class="btn secondary mini" onclick="moderate(${c.id},'Approved')">${icon('check',13)} Approve</button>`:''}<button class="btn danger mini" onclick="moderate(${c.id},'Rejected')">${icon('trash',13)} Remove</button></div></div>`}
function moderate(id,status){const c=state.comments.find(x=>x.id===id);if(c)c.status=status;setFlash(`Comment ${status.toLowerCase()}`);render()}
function settingsPage(){return `<div class="pagehead"><div><div class="eyebrow">System</div><h1>Settings</h1><p class="lead">Core newsroom configuration.</p></div></div><section class="card"><div class="card-head"><div class="card-title">General settings</div></div><div class="modal-body"><div class="row2"><div class="field"><label>Site name</label><input class="input" value="Newsroom"></div><div class="field"><label>Default locale</label><select class="input"><option>English</option><option>Vietnamese</option></select></div></div><div class="field"><label>Homepage headline</label><input class="input" value="Independent reporting for a changing world"></div><div class="field"><label>Footer description</label><textarea rows="4">A modern publication platform built for fast editorial teams.</textarea></div><button class="btn primary" onclick="setFlash('Settings saved')">Save settings</button></div></section>`}
function usersPage(){return `<div class="pagehead"><div><div class="eyebrow">Access</div><h1>Users</h1><p class="lead">Manage editors and administrators.</p></div><button class="btn primary" onclick="setFlash('User creation flow opened')">${icon('plus',16)} New user</button></div><section class="card"><table class="table"><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last active</th></tr></thead><tbody><tr><td><strong>Admin</strong><div class="muted" style="font-size:11px">admin@newsroom.test</div></td><td>Administrator</td><td>${statusBadge('Published')}</td><td>Now</td></tr><tr><td><strong>Mai Nguyen</strong><div class="muted" style="font-size:11px">mai@newsroom.test</div></td><td>Editor</td><td>${statusBadge('Published')}</td><td>14 min ago</td></tr><tr><td><strong>Linh Tran</strong><div class="muted" style="font-size:11px">linh@newsroom.test</div></td><td>Writer</td><td>${statusBadge('Published')}</td><td>1 hr ago</td></tr></tbody></table></section>`}
function publicSite(){return `<div class="public"><div class="topbar"><div class="brand"><div class="brandmark">${icon('file',17)}</div><span>Newsroom</span></div><div class="public-nav"><span onclick="nav('public')">Home</span><span>Technology</span><span>Business</span><span>Culture</span><span>World</span></div><div class="top-actions"><button class="icon-btn" onclick="nav('dashboard')">${icon('settings',16)}</button></div></div><main class="page"><div class="public-grid"><article class="hero"><div class="hero-bg"></div><div class="hero-art"></div><div class="hero-copy"><div class="eyebrow">Featured · Technology</div><h2>How AI is changing the newsroom in 2026</h2><p>From research and verification to the final edit, newsroom teams are redesigning their workflows around AI while keeping human judgment at the center.</p><div class="hero-meta"><span class="chip">8 min read</span><span>Oct 7, 2026</span><span>By Admin</span></div></div></article><div class="side-list"><article class="card story"><div class="story-thumb"></div><div><h3>The new economics of independent publishing</h3><p>Business · 12 min ago</p></div></article><article class="card story"><div class="story-thumb" style="background:linear-gradient(135deg,#d9d6ff,#a5a1e8)"></div><div><h3>What the latest data says about remote work</h3><p>World · 1 hr ago</p></div></article><article class="card story"><div class="story-thumb" style="background:linear-gradient(135deg,#d9f1e7,#8bc4aa)"></div><div><h3>A city guide to the season’s best exhibitions</h3><p>Culture · 3 hr ago</p></div></article></div></div><section class="section"><div class="section-head"><div class="section-title">Explore stories</div><div class="cat-row"><span class="cat active">All</span><span class="cat">Technology</span><span class="cat">Business</span><span class="cat">Culture</span><span class="cat">World</span><span class="cat">Lifestyle</span></div></div><div class="news-grid">${[['The infrastructure behind real-time publishing','Technology'],['Why independent media is finding new momentum','Business'],['The visual language of modern galleries','Culture'],['Five shifts redefining global work','World'],['Designing calmer digital products','Technology'],['A practical guide to better weekend reading','Lifestyle']].map((n,i)=>`<article class="card news-card"><div class="news-img" style="background:${['linear-gradient(135deg,#c8dcff,#86a0df)','linear-gradient(135deg,#ffe0cc,#e9a879)','linear-gradient(135deg,#ded7ff,#9d93e7)','linear-gradient(135deg,#d5f2e6,#8ac2a8)','linear-gradient(135deg,#d8e1ff,#8aa5e1)','linear-gradient(135deg,#ffe5ef,#e9a6be)'][i]}"></div><div class="news-body"><div class="eyebrow">${n[1]}</div><h3>${n[0]}</h3><p>Ideas, context and reporting for readers who want more than a headline.</p><div class="news-footer"><span>Oct ${7-i}, 2026</span><span>${5+i} min read</span></div></div></article>`).join('')}</div></section><section class="section"><div class="card" style="padding:24px;display:flex;justify-content:space-between;gap:20px;align-items:center"><div><div class="eyebrow">Join the conversation</div><div class="section-title" style="margin-top:6px">Thoughtful stories. Better comments.</div><div class="muted" style="font-size:12px;margin-top:6px">Reader comments are moderated in the admin panel before publication.</div></div><button class="btn primary">Browse comments</button></div></section></main></div>`}
function modal(){if(!state.modal)return '';if(state.modal==='post'){const p=state.editId?state.posts.find(x=>x.id===state.editId):null;return `<div class="modal"><div class="modal-head"><strong>${p?'Edit post':'Create post'}</strong><button class="icon-btn" style="float:right;background:#f5f6fa;color:#50596b;border-color:#e6e9ef" onclick="state.modal=null;render()">${icon('close',15)}</button></div><div class="modal-body"><div class="field"><label>Headline</label><input id="postTitle" class="input" value="${p?p.title:''}" placeholder="Enter a strong headline"></div><div class="row2"><div class="field"><label>Category</label><select id="postCat" class="input">${state.categories.map(c=>`<option ${p&&p.category===c.name?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="postStatus" class="input"><option ${!p||p.status==='Published'?'selected':''}>Published</option><option ${p&&p.status==='Draft'?'selected':''}>Draft</option><option ${p&&p.status==='Review'?'selected':''}>Review</option></select></div></div><div class="field"><label>Excerpt</label><textarea rows="4" placeholder="Short summary for listings and SEO">${p?'From research and verification to the final edit, newsroom teams are redesigning their workflows.':''}</textarea></div><div class="field"><label>Content</label><textarea rows="8" placeholder="Write your story here...">${p?'A complete story editor would be powered by React and a rich-text component in the production build.':''}</textarea></div></div><div class="modal-foot"><button class="btn secondary" onclick="state.modal=null;render()">Cancel</button><button class="btn primary" onclick="savePost()">${icon('check',14)} ${p?'Save changes':'Create post'}</button></div></div>`}
if(state.modal==='tax'){const arr=state.taxKind==='Categories'?state.categories:state.tags;const x=state.editId?arr.find(v=>v.id===state.editId):null;return `<div class="modal" style="max-width:480px"><div class="modal-head"><strong>${x?'Edit':'Create'} ${state.taxKind.slice(0,-1).toLowerCase()}</strong><button class="icon-btn" style="float:right;background:#f5f6fa;color:#50596b;border-color:#e6e9ef" onclick="state.modal=null;render()">${icon('close',15)}</button></div><div class="modal-body"><div class="field"><label>Name</label><input id="taxName" class="input" value="${x?x.name:''}" placeholder="Enter name"></div></div><div class="modal-foot"><button class="btn secondary" onclick="state.modal=null;render()">Cancel</button><button class="btn primary" onclick="saveTax()">Save</button></div></div>`}}
function render(){document.querySelector('#app').innerHTML=app();document.querySelector('#modalRoot').innerHTML=modal();if(state.modal)document.querySelector('#modalRoot').classList.add('open');else document.querySelector('#modalRoot').classList.remove('open');if(state.flash){const toast=document.createElement('div');toast.style='position:fixed;right:20px;bottom:20px;background:#10162d;color:#fff;padding:11px 14px;border-radius:11px;font-size:12px;font-weight:750;box-shadow:0 18px 40px rgba(10,16,33,.25);z-index:90';toast.textContent=state.flash;document.body.appendChild(toast);setTimeout(()=>toast.remove(),2100)}}
render();
</script>
